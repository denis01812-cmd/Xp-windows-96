name: Build and boot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install the pinned x86 emulator
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Cache verified firmware
        uses: actions/cache@v4
        with:
          path: .cache/bios
          key: seabios-315b2b0b758703ef0e6cc7b4088d6068f83f3c20
      - name: Fetch and verify firmware
        run: python3 tools/fetch_bios.py
      - name: Build bootable image
        run: python3 tools/build.py
      - name: Test image, real boot and input
        run: npm test
      - name: Package the Windows launcher and prebuilt image
        run: python3 tools/package_windows.py
      - name: Upload the ready-to-run Windows package
        uses: actions/upload-artifact@v4
        with:
          name: xp96-windows
          retention-days: 14
          if-no-files-found: error
          path: build/xp96-windows/
      - name: Upload bootable image and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: xp96-image
          retention-days: 14
          if-no-files-found: error
          path: |
            build/xp96.img
            build/kernel.elf
            build/manifest.json
            build/desktop.png
            build/start-menu.png
            build/boot-test.log

  windows-launcher:
    name: Windows launcher
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download the packaged Windows build
        uses: actions/download-artifact@v4
        with:
          name: xp96-windows
          path: downloaded-windows
      - name: Test the real batch and PowerShell entry points
        shell: powershell
        run: .\tests\windows-launcher.ps1 -PackagePath "$env:GITHUB_WORKSPACE\downloaded-windows"
      - name: Install hash-pinned native Windows QEMU
        shell: powershell
        run: |
          # SHA256 and URL from microsoft/winget-pkgs, SoftwareFreedomConservancy.QEMU 11.1.0 (x64).
          $installer = Join-Path $env:RUNNER_TEMP 'qemu-windows-setup.exe'
          curl.exe --fail --location --silent --show-error --retry 2 --max-time 180 --output $installer 'https://qemu.weilnetz.de/w64/2026/qemu-w64-setup-20260811.exe'
          if ($LASTEXITCODE -ne 0) { throw 'QEMU installer download failed.' }
          $expected = 'F98A8AEB5F7FAEA9765B6DEE28316C266CD179D80354A2FED8E50176F9A2E59F'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expected) {
            throw 'QEMU installer SHA256 mismatch.'
          }
          $setup = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "QEMU setup failed: $($setup.ExitCode)" }
      - name: Boot the packaged OS in real Windows QEMU with Cyrillic paths
        shell: powershell
        run: |
          try {
            .\tests\windows-qemu.ps1 -PackagePath "$env:GITHUB_WORKSPACE\downloaded-windows"
          } catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Native Windows QEMU::$message"
            throw
          }
      - name: Summarize native QEMU diagnostics
        if: always()
        shell: powershell
        run: |
          Get-ChildItem -Path build/windows-qemu-logs/*.log -ErrorAction SilentlyContinue | ForEach-Object {
            $text = [System.IO.File]::ReadAllText($_.FullName)
            if ($text.Length -gt 4000) { $text = $text.Substring(0, 4000) }
            $text = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::notice title=$($_.Name)::$text"
          }
      - name: Upload native QEMU boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-qemu-logs
          retention-days: 14
          if-no-files-found: ignore
          path: build/windows-qemu-logs/
